name: Apple Silicon first installation
on:
  push:
    branches: [preview-mac-27]
permissions:
  contents: read
jobs:
  cold-install:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify distributed archive on Apple Silicon
        run: python3 qa/verify-install.py sumai-agent-27-darwin-arm64.tar.gz 4016c4be95f018322b9d7a7ac035dd28d94b696a4e7364ff39cee0fdd3a12305
